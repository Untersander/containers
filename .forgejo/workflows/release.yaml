# Builds the apps from main on the rootless buildkitd in the cluster (home-ops: apps/buildkit), tests that
# they start and pushes them to the Forgejo registry and ghcr.io. An app that fails is not pushed, so it
# keeps its last image, and the schedule tries it again.
# Repository secrets: REGISTRY_TOKEN (Forgejo access token, package read/write),
# GHCR_TOKEN (GitHub classic token with write:packages)
name: Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: "52 9 * * *"
  workflow_dispatch:
    inputs:
      app:
        type: string
        description: App Name
        required: true
      no-cache:
        type: boolean
        description: No Cache
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORGEJO_REGISTRY: git.k8s.garden/jan
  GHCR_REGISTRY: ghcr.io/untersander
  GHCR_USER: Untersander
  # ghcr.io links the packages to the repository through this label
  GITHUB_REPOSITORY_URL: https://github.com/Untersander/containers
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: v0.38.2

defaults:
  run:
    shell: bash

jobs:
  changed:
    name: Get Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Buildx
        run: bash .forgejo/scripts/setup-buildx.sh

      - name: Get Apps
        id: apps
        env:
          INPUT_APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$INPUT_APP" ]]; then
            apps="$INPUT_APP"
          else
            # The apps changed by this push: a new base image keeps the tag
            apps=""
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              apps=$(git diff --name-only "$BEFORE" HEAD -- apps | cut -d/ -f2)
            fi
            # And every version without an image: new apps and builds that failed
            for dir in apps/*/; do
              ref=$(cd "$dir" && bash "${GITHUB_WORKSPACE}/.forgejo/scripts/app-tags.sh" | sed -n 1p)
              if ! buildx imagetools inspect "${GHCR_REGISTRY}/${ref}" > /dev/null 2>&1; then
                echo "${ref} has no image"
                apps+=$'\n'"$(basename "$dir")"
              fi
            done
            apps=$(sort -u <<< "$apps")
          fi
          # Deleted apps show up in the diff too
          apps=$(for app in $apps; do if [[ -f "apps/${app}/docker-bake.hcl" ]]; then echo "$app"; fi; done | jq -Rnc '[inputs]')
          echo "apps: ${apps}"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ needs.changed.outputs.apps != '[]' }}
    name: Build ${{ matrix.app }}
    needs:
      - changed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changed.outputs.apps) }}
    env:
      NO_CACHE: ${{ inputs.no-cache || false }}
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Buildx
        run: bash .forgejo/scripts/setup-buildx.sh

      # buildx hands the credentials to buildkitd, which pushes. The tokens are checked here because
      # a push without (valid) credentials only fails at the end with a bare 401
      - name: Login to Registries
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          FORGEJO_USER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          for secret in REGISTRY_TOKEN GHCR_TOKEN; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Secret ${secret} is empty or not set"
              exit 1
            fi
          done

          # Forgejo: the registry token's JWT carries the scope of the access token (anonymous: UserID -1)
          jwt=$(printf 'user = "%s:%s"\n' "$FORGEJO_USER" "$REGISTRY_TOKEN" \
            | curl -fsS -K - "https://git.k8s.garden/v2/token?service=container_registry" | jq -r .token) \
            || { echo "::error::REGISTRY_TOKEN was rejected by git.k8s.garden (user ${FORGEJO_USER})"; exit 1; }
          payload=$(cut -d. -f2 <<< "$jwt" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          scope=$(base64 -d <<< "$payload" | jq -r '.Scope')
          if [[ "$scope" != *write:package* && "$scope" != all ]]; then
            echo "::error::REGISTRY_TOKEN has scope '${scope}', it needs package read/write (write:package)"
            exit 1
          fi

          # GitHub: classic tokens list their scopes in X-OAuth-Scopes
          scopes=$(printf 'header = "Authorization: Bearer %s"\n' "$GHCR_TOKEN" \
            | curl -fsS -K - -o /dev/null -D - https://api.github.com/user | sed -n 's/^x-oauth-scopes: *//Ip' | tr -d '\r') \
            || { echo "::error::GHCR_TOKEN was rejected by GitHub"; exit 1; }
          if [[ "$scopes" != *write:packages* ]]; then
            echo "::error::GHCR_TOKEN has scopes '${scopes}', it needs a classic token with write:packages"
            exit 1
          fi

          mkdir -p ~/.docker
          jq -n '{auths: {
            "git.k8s.garden": {auth: (env.FORGEJO_USER + ":" + env.REGISTRY_TOKEN | @base64)},
            "ghcr.io": {auth: (env.GHCR_USER + ":" + env.GHCR_TOKEN | @base64)}
          }}' > ~/.docker/config.json
          echo "logged in as ${FORGEJO_USER} (scope ${scope}) and ${GHCR_USER} (scopes ${scopes})"

      - name: Get App Options
        id: options
        working-directory: ${{ github.workspace }}/apps/${{ matrix.app }}
        run: |
          variable() {
            buildx bake --list type=variables,format=json --progress=quiet \
              | jq -r --arg name "$1" '.[] | select(.name == $name) | .value'
          }
          version=$(variable VERSION)
          source=$(variable SOURCE)
          image=$(variable APP)
          platforms=$(buildx bake image-all --print --progress=quiet | jq -r '.target."image-all".platforms | join(",")')
          refs=$(bash "${GITHUB_WORKSPACE}/.forgejo/scripts/app-tags.sh")
          {
            echo "version=${version}"
            echo "source=${source}"
            echo "image=${image}"
            echo "platforms=${platforms}"
            echo "tags<<EOF"
            for registry in "$FORGEJO_REGISTRY" "$GHCR_REGISTRY"; do
              for ref in $refs; do echo "--set=image.tags=${registry}/${ref}"; done
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version ${version}, image ${image}, tags: $(echo $refs)"

      # Builds the image, the push below reuses these layers
      - name: Test App
        working-directory: ${{ github.workspace }}/apps/${{ matrix.app }}
        env:
          PLATFORMS: ${{ steps.options.outputs.platforms }}
        run: |
          buildx bake test --builder buildkitd --allow=fs.read=../../tests \
            --set=image.platform="$PLATFORMS" \
            --set=image.no-cache="$NO_CACHE"

      - name: Push App
        working-directory: ${{ github.workspace }}/apps/${{ matrix.app }}
        env:
          VERSION: ${{ steps.options.outputs.version }}
          SOURCE: ${{ steps.options.outputs.source }}
          IMAGE: ${{ steps.options.outputs.image }}
          PLATFORMS: ${{ steps.options.outputs.platforms }}
          TAGS: ${{ steps.options.outputs.tags }}
        run: |
          if [[ ! -f ~/.docker/config.json ]]; then
            echo "::error::No registry credentials in ~/.docker/config.json, did the login step run?"
            exit 1
          fi
          mapfile -t tags <<< "$TAGS"
          buildx bake image --builder buildkitd \
            --set=image.platform="$PLATFORMS" \
            --set=image.labels.org.opencontainers.image.title="$IMAGE" \
            --set=image.labels.org.opencontainers.image.version="$VERSION" \
            --set=image.labels.org.opencontainers.image.revision="$GITHUB_SHA" \
            --set=image.labels.org.opencontainers.image.source="$GITHUB_REPOSITORY_URL" \
            --set=image.labels.org.opencontainers.image.documentation="$SOURCE" \
            --metadata-file "${RUNNER_TEMP}/metadata.json" \
            --set=image.output=type=image,push=true "${tags[@]}"
          echo "pushed ${IMAGE}@$(jq -r '.image["containerimage.digest"]' "${RUNNER_TEMP}/metadata.json")"
